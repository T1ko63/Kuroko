#:schema ../schemas/settings.schema.json
# Kuroko - example settings.toml
#
# Template with every key and its default value. The app does not read this file.
# To use it, copy it to %APPDATA%\Kuroko\settings.toml and edit it.
# If that file is missing, the app creates one on first start.
# Changes are applied as soon as the file is saved. If the file has an error, the last working
# configuration stays active and a message names the file and line.
# Never put API keys in this template or in the repository.

# Hotkeys are not set here: every hotkey lives in keybinds.toml (see config/keybinds.example.toml and docs/keybindings.md).

# Number of replacements kept in memory, 0-100 (0 = undo off). The undo hotkey is undo in keybinds.toml.
undo_history = 10

# Where the result card appears: fixed (at result_fixed_position on the monitor the target window is on) | follow (where the prompt
# picker opens, see overlay_position) | caret (at the text cursor, otherwise at the mouse) | mouse (at the mouse).
# With follow, caret and mouse the card grows down, or up when there is no room below.
result_position = "fixed"
# The fixed place: top-third | center | bottom-third (horizontally centered, in the middle of that third), top-left | bottom-left |
# top-right | bottom-right (corners), left | right (at that edge, vertically centered), top | bottom (at that edge, horizontally centered).
# The card always grows away from the screen edge it sits at (cards at the top grow down, cards at the bottom grow up, cards in the
# middle grow in both directions), so it never leaves the screen.
result_fixed_position = "bottom-third"
# Distance of the card to the screen edge in pixels, 0-200.
result_screen_margin = 24
# Font size of the result card text, 8-32 (decimals such as 14.5 are fine).
result_font_size = 15
# Size of the card in pixels (never larger than the monitor). The width is fixed (240-1600). The height follows the text, but is at
# least result_min_height (0-2000, 0 = as small as the text) and at most result_max_height (120-2000); longer text scrolls.
result_width = 480
result_min_height = 0
result_max_height = 360

# Where the status pill (progress, notes, errors) appears: follow (where the prompt picker opens, default) | caret (at the text
# cursor, otherwise at the mouse) | mouse | fixed (at pill_fixed_position) | card (where the result
# card appears, see result_position). For prompts with a result card the pill always sits where the card will appear.
pill_position = "follow"
pill_fixed_position = "top-third"   # same places as result_fixed_position
pill_screen_margin = 8      # distance to the screen edge in px, 0-200 (fixed, caret and mouse)
pill_min_width = 200        # 100-1600 px; longer text wraps at pill_max_width
pill_max_width = 420        # 100-1600 px
pill_min_height = 0         # 0-400 px (0 = as high as the text; otherwise the text is centred and the pill grows when it wraps)
pill_font_size = 13         # 8-32
pill_duration = 2           # seconds a note such as "Undone" stays, 0.5-60
pill_error_duration = 5     # seconds an error stays, 0.5-300; 0 = until clicked or Esc (a failed paste: at least 15 s)

# Markers for one-off instructions inside the text, e.g.  <<shorter>> Hello ...
# Used by prompts with mode = "universal". Must not be empty.
marker_start = "<<"
marker_end = ">>"

theme = "system"            # system | light | dark
accent = "none"             # none | system | hex colour like "#3B82F6" (caret, text selection, progress line)
overlay_position = "caret"  # caret | mouse | fixed

# Prompt picker (and the pill with pill_position = "follow"): a fixed place and size, like the result card. The fixed place (overlay_position = "fixed") is
# one of top-third | center | bottom-third | top-left | bottom-left | top-right | bottom-right | left | right | top | bottom.
# The picker grows away from the screen edge it sits at. The margin is the distance to the screen edge in pixels (0-200).
overlay_fixed_position = "top-third"
overlay_screen_margin = 8
overlay_font_size = 14.5      # 8-32; the whole picker scales with it
overlay_width = 520           # 240-1600, never larger than the monitor
overlay_min_height = 0        # 0-2000 (0 = as small as the list)
overlay_max_height = 393      # 120-2000: search line plus eight rows; longer lists scroll
language = "auto"           # auto | de | en
autostart = false           # start with Windows

# Free unused memory after this many idle seconds (0 = never).
idle_trim_seconds = 90

# Provider used when a prompt does not name one. Must exist under [providers.*].
default_provider = "gemini"

# Fallback provider (off when empty). If a provider cannot be reached (no connection, server error 5xx, rate limit 429),
# the same request goes once to this provider, e.g. "local" for the Ollama model below. Privacy: your text then goes to
# that provider instead of the one the prompt names. Not used after Esc, for rejected keys or requests (4xx) or timeouts,
# never more than one step, and never by local providers (their text stays on the PC unless their own block says otherwise).
# A provider block can override it with its own fallback_provider ("" = no fallback for that provider).
fallback_provider = ""


[appearance]
placeholder = "Kuroko"      # grey text in the empty search field; "" = none
transparency = 50           # 0-100 percent: 0 = opaque, 100 = fully transparent
radius = 10                 # corner radius in px, 0-100
blur = "acrylic"            # acrylic | blur | mica | micaalt | none
selection_style = "fill"    # selected row: fill (area) | border (frame only, the text does not move)
selection_opacity = 25      # its opacity in percent, 0-100, for both styles; hover has half of it
selection_border_width = 1  # frame width in px with selection_style = "border", 1-4
border = true               # thin border around the window
border_width = 1            # border width in px, 0-4 (border = false means 0)
separator = true            # line under the search field
separator_width = 1         # its height in px, 0-4
font = "Segoe UI Variable Text, Segoe UI"   # overlay, pill, result card and API key window; first installed name wins
custom_corners = false         # true: apply the radius exactly on Acrylic/Mica too (needs the Windhawk mod, corners part); false: Windows snaps to 0, 4 or 8 px

[appearance.dark]
background = "#000000"      # #RRGGBB or rgb(r, g, b)
foreground = "#F0F0F0"      # main text colour
selection  = "#FFFFFF"      # selected row: #RRGGBB or rgb(r, g, b); its opacity is selection_opacity
# border_color    = "#3D3D3D"   # optional, #RRGGBB or rgb(r, g, b); derived from foreground when missing
# separator_color = "#2E2E2E"   # optional, likewise

[appearance.light]
background = "#FFFFFF"
foreground = "#1A1A1A"
selection  = "#000000"


# One [providers.<name>] block per provider. The name is free and is used by
# default_provider and by the provider key in prompts.toml.
#
#   type               required: openai | gemini | anthropic | openai-compatible
#   model              required: model name
#   api_key_env        name of the environment variable that holds the key
#   api_key            key written directly in the file (local only, never commit)
#
# The key is looked up in this order: api_key, then the variable from api_key_env, then the Windows
# Credential Manager entry "Kuroko:<name>" (store it via tray icon -> "API keys ..."; no setting needed here).
#   base_url           optional, defaults per type
#   timeout_seconds    optional, 1-600 (default 30; 120 with service_tier = "flex")
#   reasoning          optional: off | default | low | medium | high | xhigh | max (default off)
#   service_tier       optional, openai only: standard | fast | ultrafast | flex (default standard)
#   max_output_tokens  optional, 0 = automatic (default)
#   fallback_provider  optional: provider to try once when this one cannot be reached; wins over the global
#                      fallback_provider, "" = none for this provider (default: the global one)

[providers.gemini]
type = "gemini"
model = "gemini-2.5-flash"
api_key_env = "GEMINI_API_KEY"
reasoning = "off"

[providers.anthropic]
type = "anthropic"
model = "claude-haiku-4-5"
api_key_env = "ANTHROPIC_API_KEY"
reasoning = "off"

[providers.openai]
type = "openai"
model = "gpt-5.5"
api_key_env = "OPENAI_API_KEY"
reasoning = "off"
service_tier = "standard"

# Local models through an OpenAI-compatible server (Ollama, LM Studio). No key needed.
[providers.local]
type = "openai-compatible"
base_url = "http://localhost:11434/v1"
model = "llama3.2"
timeout_seconds = 60
